# Uses the prebuilt al-folio image; `docker compose build` builds it from the Dockerfile instead.
services:
  jekyll:
    image: amirpourmand/al-folio:latest
    build: .
    command: /srv/jekyll/bin/entry_point.sh
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
