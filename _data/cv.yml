cv:
  name: Mohammed
  headline: Robotics Engineer
  location: Addis Ababa, Ethiopia
  email: mohammed.gsr-5161-16@aau.edu.et
  website: https://berito.github.io

  social_networks:
    - network: LinkedIn
      username: mohsraj
    - network: GitHub
      username: berito
    - network: YouTube
      username: LearnBotics

  sections:
    Summary:
      - bullet: >-
          Robotics engineer building autonomous ground robots and drones in ROS 2 and simulation. Tuned Nav2 for a client robot to 30 of 30
          benchmark runs, built multi-robot Gazebo simulation for up to 8 robots, and flew PX4 offboard laps that repeat within 6 cm.

    Experience:
      - company: Upwork (remote)
        position: Freelance Robotics Engineer
        start_date: 2025-06
        end_date: present
        highlights:
          - >-
            Unitree L2 LiDAR SLAM (solo): selected and integrated the SLAM stack for the client's solid-state LiDAR (Point-LIO odometry with a GTSAM
            pose-graph back-end), set up its UDP driver and IMU, and handed over in Docker.
          - >-
            Jetacker Nav2 tuning (solo): built the simulation and Nav2 stack as about 20 Docker containers and tuned planners, costmaps and obstacle
            avoidance with a structured method to 30 of 30 runs on the walls map and 26 of 30 with obstacles; patched a `use_sim_time` deadlock in
            `robot_localization` from source; reported an integrity problem in the client's data.
          - >-
            SkyHunter multi-robot UGV simulation (team; my parts: simulation, communication, localization and navigation): built the Gazebo simulation
            from the robot's CAD (STEP) files, with LiDAR, IMU, GPS and gimbal cameras and spawning of up to 8 robots; set up EKF localization, GPS in
            the local frame with `navsat_transform`, Nav2 and a 27-frame TF tree; wrote the communication package, a failover state machine across
            WiFi, LTE and LoRa with measured latency.
          - "erthbot thermal inspection (team): built the UI of a deployed solar-panel thermal inspection system."
          - "SLAM tutoring (1-on-1): pose-graph optimization, factor graphs and LiDAR-inertial odometry."

      - company: Addis Ababa University
        position: Part-time Lecturer, Robotics
        location: Ethiopia
        start_date: 2026-09
        end_date: present
        highlights:
          - >-
            Introduction to Robotics and Intelligent Systems (fourth-year BSc Software Engineering): lectures and weekly labs, from robot motion and
            control and sensing to Kalman filtering, localization and mapping, and path planning, run on a simulated mobile robot in ROS 2 and Gazebo.
          - >-
            Robotics and Intelligent Systems (MSc in Artificial Intelligence), lab assistant: ROS 2 labs on simulation, perception, sensor fusion and
            SLAM, and robot arm motion planning with MoveIt 2.
          - Lab material published on GitHub.

      - company: Samara University
        position: Assistant Lecturer, Electrical and Computer Engineering
        location: Ethiopia
        start_date: 2021-11
        end_date: present
        highlights:
          - Teach undergraduate courses in C++ programming, Python, operating systems, relational database systems and VLSI design.

      - company: High-School STEM Program, Samara University
        position: Instructor and Coordinator
        location: Ethiopia
        start_date: 2021-11
        end_date: 2023-11
        highlights:
          - >-
            Coordinated and taught a weekend STEM program across two cohorts: Arduino, electronics, programming, 3D printing and wheeled robots, ending
            in team capstone projects.
          - Mentored student teams that won 1st place at a national innovation competition (2023).

      - company: Elamiso Consulting
        position: Co-Founder (part-time)
        location: Ethiopia
        start_date: 2020-01
        end_date: 2023-12
        highlights:
          - "Software and IT consultancy: ERP implementation on Odoo and software deployment."

      - company: ICT Business Application Development, Samara University
        position: Software Developer
        location: Ethiopia
        start_date: 2018-11
        end_date: 2021-10
        highlights:
          - Developed the university's business applications in Java and Spring Boot (microservices, PostgreSQL).

    Projects:
      - name: "MSc thesis: robust pose-graph optimization"
        date: in progress
        summary: C++17, GTSAM, g2o
        highlights:
          - >-
            Correlation-aware robust pose-graph optimization; baseline campaign of robust back-ends (GNC, DCS, Switchable Constraints) with my own
            precision, recall, ATE and RPE evaluator.

      - name: PX4 track pacing drone
        summary: PX4 SITL, ROS 2, MAVROS, Gazebo Harmonic, Python
        highlights:
          - >-
            A drone that flies a configured route lap after lap: offboard flight node with a state machine, track geometry with velocity and
            acceleration feed-forward, and a Gazebo world generated from the same geometry. Laps 2 and 3 within 6 cm of each other (PX4 flight log).
            Video on YouTube.

      - name: Mengabot multi-robot simulation
        summary: ROS 2, Gazebo Harmonic
        highlights:
          - A modular multi-robot ground platform in simulation, reusable for any ground robot, running up to 8 robots. Video on YouTube.

      - name: Mengabot camera perception
        summary: C++, ONNX Runtime, ROS 2, Gazebo Harmonic
        highlights:
          - >-
            YOLOv8 detection, ByteTrack tracking and a Kalman-filter target estimator with lead point. On a 0.275 m target crossing at 0.5 m/s, 5 m
            away: detected in 194 of 194 images, tracked in 133 of 137 messages, position median error 0.19 m, velocity 0.49 m/s against 0.5, against
            simulation ground truth.

    Education:
      - institution: Addis Ababa University
        area: Artificial Intelligence
        degree: MSc
        location: Ethiopia
        start_date: 2023-08
        end_date: 2026-12
        highlights:
          - "Expected December 2026. Thesis in progress: robust pose-graph optimization for SLAM."
          - >-
            Coursework: Artificial Intelligence, Machine Learning, Deep Learning, Computer Vision, Reinforcement Learning, Probabilistic Graphical
            Models, Natural Language Processing, Distributed Systems for AI, Cognitive Science.

      - institution: Eritrean Institute of Technology
        area: Computer Engineering
        degree: BSc
        location: Eritrea

    Technical Skills:
      - label: State estimation and sensor fusion
        details: >-
          EKF (robot_localization), particle filters, factor graphs and pose-graph optimization (GTSAM, g2o), robust estimation (M-estimators, GNC,
          IRLS, DCS, Switchable Constraints), Lie groups SE(3), IMU processing and time sync, GNSS with navsat_transform
      - label: SLAM and mapping
        details: >-
          LiDAR-inertial SLAM (Point-LIO), loop closure, globally consistent mapping, TF chains, geographic frames (WGS84, ENU, UTM), evaluation (ATE,
          RPE)
      - label: Navigation
        details: Nav2 tuning and benchmarking (costmaps, controller, planner), MCL/AMCL
      - label: Simulation
        details: Gazebo Harmonic, multi-robot simulation, URDF/Xacro, CAD to robot model, wireless link simulation
      - label: Drones
        details: PX4 SITL, offboard control with MAVROS, ArduPilot SITL
      - label: Perception
        details: YOLOv8 in ONNX Runtime (C++), ByteTrack, Kalman-filter target estimation, PCL
      - label: Programming and tools
        details: C++17, Python, ROS 2, PyTorch, Docker, Git, Linux, FastAPI
      - label: Teaching and technical writing
        details: University teaching since 2021, lab material, client technical reports

    Achievements:
      - bullet: Student teams I mentored and coordinated won 1st place at a national innovation competition, 2023.
